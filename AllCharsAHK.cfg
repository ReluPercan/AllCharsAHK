# ==============================================================================
# AllCharsAHK - Configuration File
# ==============================================================================
# QUICK HELP & SYNTAX GUIDE:
#
# 1. TRIGGER KEYS (Sequential Press - Tap & Release, do NOT hold down):
#    - Generic families: c = Any Ctrl,  a = Any Alt,  s = Any Shift
#    - Specific keys:    lc / rc = Left / Right Ctrl
#                        la / ra = Left / Right Alt (AltGr)
#                        ls / rs = Left / Right Shift
#
# 2. MAPPING FORMAT:
#    [trigger] [key1] [key2] ... -> [replacement_text_or_character]
#    - Example single character:  rc a -> ă
#    - Example multiple letters:  lc o k -> 🆗
#    - Enclose multi-word text in double quotes:
#        rc c -> "Clipboard text is:\n\"\cb\""
#
# 3. ESCAPE SEQUENCES & DYNAMIC MACROS:
#    - \n = Newline
#    - \t = Tab
#    - \" = Literal double quote
#    - \\ = Literal backslash
#    - \cb = Current Clipboard text contents (inserts dynamically)
#
# 4. HOW TO RELOAD SETTINGS:
#    After saving this file, right-click the AllCharsAHK tray icon and select "Reload".
# ==============================================================================
#
# NOTE ON CUSTOMIZATION:
# All entries in this file (mappings, rare characters, and text snippets) are
# fully customizable examples. You can freely edit, reassign, or delete ANY
# or ALL of them to match your personal needs. None are strictly required,
# though at least one key mapping should exist for the script to be useful!
# ==============================================================================

# --- Global Settings ---

# UI Language: "en" (English), "ro" (Romanian), "de" (German).
# If commented out or omitted, it is auto-detected from Windows regional settings.
